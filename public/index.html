<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Clases Online</title>
  <link rel="icon" href="/favicon.ico" />

  <!-- Shoelace (Web Components) — tema claro -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>

  <!--
    Estructura en blanco: todo el contenido se controla desde js/app.js.
    El CSS del proyecto vivirá en css/main.css (importa reset, variables y componentes).
  -->
    <style>
      body{
        margin: 0;
      }
    </style>
</head>
<body>
  <!-- Punto de montaje: todo se renderiza desde JS -->
  <main id="app">
    <!-- Visible mientras cargan los módulos; si se queda fijo, JS no llegó a ejecutarse -->
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #888;">
      Cargando…
    </p>
  </main>

  <!-- Diagnóstico temporal: muestra errores en pantalla en vez de página en blanco (quitar en producción) -->
  <script>
    (function () {
      // Ruido BENIGNO del navegador (lo dispara Shoelace al abrir el dropdown, etc.)
      var RUIDO = /ResizeObserver loop/i;
      function esRuido(t) { return RUIDO.test(t || ""); }

      function mostrarError(msg) {
        // Aviso flotante NO destructivo: NUNCA reemplaza el contenido de #app
        var previo = document.getElementById("diag-error");
        if (previo) previo.remove();
        var caja = document.createElement("div");
        caja.id = "diag-error";
        caja.style.cssText =
          "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;max-width:560px;" +
          "margin:0 auto;padding:1rem 1.25rem;border:2px solid #dc2626;border-radius:.75rem;" +
          "color:#7f1d1d;background:#fef2f2;font-family:sans-serif;font-size:.9rem;" +
          "box-shadow:0 10px 30px rgba(0,0,0,.18)";
        var titulo = document.createElement("strong");
        titulo.textContent = "Error detectado";
        titulo.style.cssText = "display:block;margin-bottom:.35rem";
        var texto = document.createElement("span");
        texto.style.cssText = "white-space:pre-wrap";
        texto.textContent = msg;
        caja.append(titulo, texto);
        document.body.append(caja);
      }
      if (location.protocol === "file:") {
        mostrarError(
          "Estás abriendo el archivo directamente (file://). Los módulos ES de JavaScript " +
          "requieren un servidor local.\n\nOpciones:\n" +
          "  - firebase serve (o firebase emulators:start)\n" +
          "  - npx http-server public\n" +
          "  - python -m http.server  (ejecutado dentro de public/)\n" +
          "  - Extensión Live Server de VS Code (abrir public/index.html)"
        );
      }
      window.addEventListener("error", function (e) {
        if (esRuido(e.message)) return; // ruido benigno: ignorar
        if (!e.message) return; // errores de recursos ya cubiertos por el aviso de file://
        mostrarError((e.message || "Error desconocido") + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        var msg = "Error de promesa: " + ((r && (r.message || r.code)) || r);
        if (esRuido(msg)) return; // ruido benigno: ignorar
        mostrarError(msg);
      });
    })();
  </script>

  <!-- Punto de entrada principal de la aplicación -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
