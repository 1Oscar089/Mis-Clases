<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Clases Online</title>
  <link rel="icon" href="/favicon.ico" />

  <!-- Shoelace (Web Components) — tema claro -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>

  <!--
    Estructura en blanco: todo el contenido se controla desde js/app.js.
    El CSS del proyecto vivirá en css/main.css (importa reset, variables y componentes).
  -->
    <style>
      body{
        margin: 0;
      }
    </style>
</head>
<body>
  <!-- Punto de montaje: todo se renderiza desde JS -->
  <main id="app">
    <!-- Visible mientras cargan los módulos; si se queda fijo, JS no llegó a ejecutarse -->
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #888;">
      Cargando…
    </p>
  </main>

  <!-- Diagnóstico temporal: muestra errores en pantalla en vez de página en blanco (quitar en producción) -->
  <script>
    (function () {
      function mostrarError(msg) {
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML =
          '<div style="font-family:sans-serif;max-width:560px;margin:12vh auto 0;padding:1.5rem;' +
          'border:2px solid #dc2626;border-radius:.75rem;color:#7f1d1d;background:#fef2f2">' +
          '<h2 style="margin:0 0 .5rem;font-size:1.1rem">Error al cargar la aplicación</h2>' +
          '<p style="margin:0;white-space:pre-wrap">' + msg + "</p></div>";
      }
      if (location.protocol === "file:") {
        mostrarError(
          "Estás abriendo el archivo directamente (file://). Los módulos ES de JavaScript " +
          "requieren un servidor local.\n\nOpciones:\n" +
          "  - firebase serve (o firebase emulators:start)\n" +
          "  - npx http-server public\n" +
          "  - python -m http.server  (ejecutado dentro de public/)\n" +
          "  - Extensión Live Server de VS Code (abrir public/index.html)"
        );
      }
      window.addEventListener("error", function (e) {
        if (!e.message) return; // errores de recursos ya cubiertos por el aviso de file://
        mostrarError((e.message || "Error desconocido") + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        mostrarError("Error de promesa: " + ((r && (r.message || r.code)) || r));
      });
    })();
  </script>

  <!-- Punto de entrada principal de la aplicación -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
