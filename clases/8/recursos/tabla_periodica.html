<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica Interactiva</title>
    <style>
        :root {
            --color-bg: #ffffff;
            --color-primary: #2980b9;
            --color-secondary: #d4efdf;
            --color-accent: #a9dfbf;
            --color-text: #2c3e50;
            --color-text-light: #555555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--color-primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--color-primary);
            margin: 0;
            font-size: 1.8rem;
        }

        .leyenda {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
        }

        .leyenda-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        .tabla-periodica {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .elemento {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .elemento:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 10;
            position: relative;
        }

        .elemento .numero {
            font-size: 0.65rem;
            color: var(--color-text-light);
        }

        .elemento .simbolo {
            font-size: 1rem;
            font-weight: bold;
            color: var(--color-text);
        }

        .elemento .nombre {
            font-size: 0.55rem;
            color: var(--color-text-light);
        }

        .elemento .masa {
            font-size: 0.6rem;
            color: var(--color-text-light);
        }

        /* Colores por tipo */
        .no-metal {
            background-color: #a8e6cf;
        }

        .gas-noble {
            background-color: #ffd3b6;
        }

        .alcalino {
            background-color: #ffaaa5;
        }

        .alcalinoterreo {
            background-color: #ff8b94;
        }

        .metal-transicion {
            background-color: #dcedc1;
        }

        .post-transicion {
            background-color: #a8d8ea;
        }

        .metaloide {
            background-color: #ffd3b6;
        }

        .lantanido {
            background-color: #ffb7b2;
        }

        .actinido {
            background-color: #e2b4bd;
        }

        .vacio {
            background-color: transparent;
            border: none;
        }

        .separador {
            grid-column: 1 / -1;
            height: 20px;
        }

        .fila-lantanidos,
        .fila-actinidos {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            margin-top: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-contenido h2 {
            color: var(--color-primary);
            margin-top: 0;
        }

        .modal-contenido .dato {
            margin: 10px 0;
            padding: 8px;
            background-color: var(--color-secondary);
            border-radius: 5px;
        }

        .modal-contenido .dato strong {
            color: var(--color-primary);
        }

        .cerrar {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .cerrar:hover {
            background-color: #1f618d;
        }

        @media (max-width: 768px) {
            .tabla-periodica {
                grid-template-columns: repeat(18, minmax(40px, 1fr));
                font-size: 0.7rem;
            }

            .elemento {
                min-height: 50px;
            }

            .elemento .simbolo {
                font-size: 0.8rem;
            }

            .elemento .nombre {
                display: none;
            }
        }
    </style>
</head>

        const tiposNombres = {
            "no-metal": "No metal",
            "gas-noble": "Gas noble",
            "alcalino": "Metal alcalino",
            "alcalinoterreo": "Metal alcalinotérreo",
            "metal-transicion": "Metal de transición",
            "post-transicion": "Metal post-transición",
            "metaloide": "Metaloide",
            "lantanido": "Lantánido",
            "actinido": "Actínido"
        };

        function crearElementoHTML(el) {
            const div = document.createElement('div');
            div.className = `elemento ${el.t}`;
            div.innerHTML = `
            <div class="numero">${el.z}</div>
            <div class="simbolo">${el.s}</div>
            <div class="nombre">${el.n}</div>
            <div class="masa">${el.m}</div>
        `;
            div.onclick = () => mostrarModal(el);
            return div;
        }

        // Construir tabla principal
        const tabla = document.getElementById('tabla-principal');
        const grid = Array(7).fill(null).map(() => Array(18).fill(null));

        elementos.forEach(el => {
            if (el.fila && !el.esLantanido && !el.esActinido) {
                grid[el.fila - 1][el.col - 1] = el;
            }
        });

        for (let f = 0; f < 7; f++) {
            for (let c = 0; c < 18; c++) {
                const el = grid[f][c];
                if (el) {
                    tabla.appendChild(crearElementoHTML(el));
                } else {
                    const vacio = document.createElement('div');
                    vacio.className = 'elemento vacio';
                    tabla.appendChild(vacio);
                }
            }
        }

        // Fila de lantánidos
        const filaLan = document.getElementById('fila-lantanidos');
        const marcadorLan = document.createElement('div');
        marcadorLan.className = 'elemento lantanido';
        marcadorLan.innerHTML = '<div class="numero">57-71</div><div class="simbolo">La-Lu</div><div class="nombre">Lantánidos</div>';
        marcadorLan.style.gridColumn = '3';
        tabla.appendChild(marcadorLan);

        const filaAct = document.getElementById('fila-actinidos');
        const marcadorAct = document.createElement('div');
        marcadorAct.className = 'elemento actinido';
        marcadorAct.innerHTML = '<div class="numero">89-103</div><div class="simbolo">Ac-Lr</div><div class="nombre">Actínidos</div>';
        marcadorAct.style.gridColumn = '3';
        tabla.appendChild(marcadorAct);

        // Construir filas separadas
        elementos.filter(e => e.filaL === 1).forEach(el => {
            const div = crearElementoHTML(el);
            div.style.gridColumn = el.col;
            filaLan.appendChild(div);
        });

        elementos.filter(e => e.filaL === 2).forEach(el => {
            const div = crearElementoHTML(el);
            div.style.gridColumn = el.col;
            filaAct.appendChild(div);
        });

        function mostrarModal(el) {
            document.getElementById('modal-titulo').textContent = `${el.s} - ${el.n}`;
            document.getElementById('modal-numero').textContent = el.z;
            document.getElementById('modal-simbolo').textContent = el.s;
            document.getElementById('modal-nombre').textContent = el.n;
            document.getElementById('modal-masa').textContent = el.m;
            document.getElementById('modal-config').textContent = el.c;
            document.getElementById('modal-tipo').textContent = tiposNombres[el.t];
            document.getElementById('modal').classList.add('activo');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('activo');
        }

        document.getElementById('modal').onclick = (e) => {
            if (e.target.id === 'modal') cerrarModal();
        };
